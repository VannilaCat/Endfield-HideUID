; Endfield Hide UID - MIT - VannilaCat
; Rocket / EFMI / XXMI, DirectX 11. No DLL or copied game shader required.
namespace = EndfieldHideUID

[Constants]
global $enabled = 1
; Normalized bounds of the lower-left UID text, excluding the ping indicator.
global $left = 0.050
global $right = 0.160
global $top = 0.970
global $bottom = 1.000

[ShaderOverrideUIDTextIdentity]
hash = 8241579e34ea6fc2
filter_index = 73182
allow_duplicate_hash = true

[ShaderRegexUIDTextClip]
shader_model = ps_5_0
temps = bounds limits hit
; IniParams slots 310/311 are private scratch space for this draw only.
x310 = 0
y310 = 0
if $enabled && $\EFMIv1\enable_mods && ps == 73182
    x310 = rt_width
    y310 = rt_height
    x311 = $left
    y311 = $right
    z311 = $top
    w311 = $bottom
endif
post x310 = 0
post y310 = 0

[ShaderRegexUIDTextClip.Pattern]
(?P<declarations>dcl_constantbuffer cb0\[1\], immediateIndexed\n
dcl_constantbuffer cb1\[8\], immediateIndexed\n
dcl_constantbuffer cb2\[26\], immediateIndexed\n
dcl_constantbuffer cb3\[48\], immediateIndexed\n
(?:dcl_[^\n]+\n)*?dcl_temps \d+\n)

[ShaderRegexUIDTextClip.Pattern.Replace]
${0}
ld_indexable(texture1d)(float,float,float,float) ${bounds}.xyzw, l(310, 0, 0, 0), t120.xyzw\n
if_nz ${bounds}.x\n
ld_indexable(texture1d)(float,float,float,float) ${limits}.xyzw, l(311, 0, 0, 0), t120.xyzw\n
mul ${limits}.xy, ${limits}.xyxx, ${bounds}.xxxx\n
mul ${limits}.zw, ${limits}.zzzw, ${bounds}.yyyy\n
ge ${hit}.x, v0.x, ${limits}.x\n
lt ${hit}.y, v0.x, ${limits}.y\n
and ${hit}.x, ${hit}.x, ${hit}.y\n
ge ${hit}.y, v0.y, ${limits}.z\n
and ${hit}.x, ${hit}.x, ${hit}.y\n
lt ${hit}.y, v0.y, ${limits}.w\n
and ${hit}.x, ${hit}.x, ${hit}.y\n
discard_nz ${hit}.x\n
endif\n

[ShaderRegexUIDTextClip.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120
dcl_input_ps_siv v0.xy, position
